<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence Pro</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --accent: #38bdf8; --text: #f8fafc; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .grid { display: grid; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 16px; border: 1px solid #1e293b; }
        h1 { color: var(--accent); text-align: center; }
        .leg { border-left: 4px solid var(--accent); padding-left: 15px; margin: 10px 0; }
        .score { font-size: 1.5em; font-weight: bold; color: var(--accent); }
    </style>
</head>
<body>
    <h1>Football Intelligence Pro</h1>
    <div id="dashboard" class="grid"></div>
    <script>
        fetch('parlay_engine_output.json')
            .then(res => res.json())
            .then(data => {
                const ticket = data.parlay_ticket;
                let html = `<div class='card'><h2>Combinada Premium: x${ticket.combined_multiplier_estimate}</h2>`;
                ticket.legs.forEach(leg => {
                    html += `<div class='leg'><p><strong>${leg.market}</strong><br>${leg.selection}<br><small>${leg.statistical_backing}</small></p></div>`;
                });
                html += `</div>`;
                document.getElementById('dashboard').innerHTML = html;
            });
    </script>
</body>
</html>
