<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Intelligence Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #0a0e14; --card: #151a23; --text: #e0e0e0; --accent: #00d4ff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
        .app-container { max-width: 600px; margin: auto; }
        .card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .header img { width: 50px; height: 50px; border-radius: 50%; }
        h2 { margin: 0; font-size: 1.2rem; }
        .stats { font-size: 0.9rem; color: #aaa; }
        .btn-update { background: var(--accent); color: black; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Dashboard LPF</h1>
        <div id="dashboard">
            <!-- Clubes -->
            <div class="card">
                <div class="header">
                    <img src="https://r2.thesportsdb.com/images/media/team/badge/bm7krb1775741582.png" alt="Boca">
                    <div><h2>Boca Juniors</h2><div class="stats">DT: Rodolfo Arruabarrena</div></div>
                </div>
            </div>
            <div class="card">
                <div class="header">
                    <img src="https://r2.thesportsdb.com/images/media/team/badge/vi4mu41695734959.png" alt="Racing">
                    <div><h2>Racing Club</h2><div class="stats">DT: Gustavo Costas</div></div>
                </div>
            </div>
            <div class="card">
                <div class="header">
                    <img src="https://r2.thesportsdb.com/images/media/team/badge/03dmi31645539717.png" alt="River">
                    <div><h2>River Plate</h2><div class="stats">DT: Leonardo Ponzio (Interino)</div></div>
                </div>
            </div>
            <div class="card">
                <div class="header">
                    <img src="https://r2.thesportsdb.com/images/media/team/badge/jo98m71517769587.png" alt="Velez">
                    <div><h2>Vélez Sarsfield</h2><div class="stats">DT: Guillermo Barros Schelotto</div></div>
                </div>
            </div>
        </div>
        <button class="btn-update" onclick="window.location.reload()">REFRESCAR DATOS</button>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
