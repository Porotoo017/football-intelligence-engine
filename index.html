<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0e14; color: #e6edf3; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 16px; margin-bottom: 12px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h1 { font-size: 1.4rem; color: #58a6ff; margin-bottom: 20px; text-align: center; }
        .match { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; color: #ffffff; }
        .market { font-size: 0.95rem; color: #8b949e; }
        .odd { font-weight: bold; color: #3fb950; font-size: 1.1rem; }
        .error { color: #f85149; text-align: center; }
    </style>
</head>
<body>
    <h1>Football Intelligence Pro</h1>
    <div id="dashboard">Cargando datos en tiempo real...</div>
    <script>
        const d = document.getElementById('dashboard');
        fetch('parlay_engine_output.json', { cache: "no-store" })
            .then(r => {
                if (!r.ok) throw new Error("Error cargando datos");
                return r.json();
            })
            .then(data => {
                d.innerHTML = data.map(i => `
                    <div class="card">
                        <div class="match">${i.match}</div>
                        <div class="market">Mercado: <b>${i.market}</b></div>
                        <p>Probabilidad: ${i.probability}% | Cuota: <span class="odd">${i.odds}</span></p>
                        <small style="color:#8b949e">${i.analysis}</small>
                    </div>
                `).join('');
            })
            .catch(e => {
                d.innerHTML = '<div class="error">Error: No se pudo conectar con el servidor de datos. Verificando conexión...</div>';
                console.error(e);
            });
    </script>
</body>
</html>
