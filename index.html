<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence Engine</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 20px; }
        .match-card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .teams { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .team { display: flex; flex-direction: column; align-items: center; width: 40%; }
        .team img { width: 60px; height: 60px; object-fit: contain; }
        .stats { font-size: 0.9em; color: #94a3b8; }
    </style>
</head>
<body>
    <h1>Inteligencia en Tiempo Real</h1>
    <div id="app">Cargando datos en vivo...</div>
    <script>
        fetch('parlay_engine_output.json?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
            document.getElementById('app').innerHTML = data.map(m => `
                <div class="match-card">
                    <div class="teams">
                        <div class="team"><img src="${m.homeCrest}" alt="Escudo"><span>${m.home}</span></div>
                        <div>vs</div>
                        <div class="team"><img src="${m.awayCrest}" alt="Escudo"><span>${m.away}</span></div>
                    </div>
                    <div class="stats">
                        <p>Fecha: ${m.date} ${m.time}</p>
                        <p>Goleador potencial: ${m.topShooter}</p>
                        <p>Pronóstico: ${m.prediction}</p>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
