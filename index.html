<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Intelligence Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto; background: #020617; color: white; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; color: #38bdf8; }
        .dashboard { display: grid; gap: 15px; }
        .card { background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .data-point { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="header"><h1>Football Intelligence Pro</h1></div>
    <div id="app" class="dashboard">
        <!-- Dashboard dinámico -->
    </div>
    <script>
        fetch('REPORT_ACTUAL.md').then(res => res.text()).then(md => {
            document.getElementById('app').innerHTML = md.split('---')[1];
        });
    </script>
</body>
</html>
