<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Intel Engine</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="max-w-md mx-auto p-4">
        <h1 class="text-xl font-bold text-emerald-500 mb-4">Motor LPF 2026</h1>
        <div id="stats" class="space-y-4">Cargando análisis táctico...</div>
    </div>
    <script>
        // Motor básico de carga de datos
        fetch('./data.json').then(r => r.json()).then(data => {
            document.getElementById('stats').innerHTML = data.map(m => `
                <div class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">
                    <p class="font-bold">${m.partido}</p>
                    <p class="text-xs text-zinc-400">Pick: ${m.pick}</p>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
