<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Intelligence Engine</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');</script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <div class="p-4">
        <h1 class="text-2xl font-bold text-emerald-500 mb-4">Football Engine</h1>
        <div id="data" class="bg-zinc-900 p-4 rounded-xl border border-zinc-800">Cargando análisis táctico...</div>
    </div>
    <script>
        fetch('REPORT_ACTUAL.md')
            .then(res => res.text())
            .then(text => document.getElementById('data').innerText = text);
    </script>
</body>
</html>
