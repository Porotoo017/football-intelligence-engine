<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LPF Intelligence App</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0a0a0c; color: #e0e0e0; margin: 0; padding: 20px; }
        .card { background: #16161a; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #333; }
        h1 { color: #00d4ff; font-size: 1.5rem; margin-top: 0; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-box { background: #202026; padding: 10px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .btn-refresh { display: block; width: 100%; padding: 15px; background: #00d4ff; color: #000; text-align: center; border-radius: 8px; font-weight: bold; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>LPF Intelligence Engine</h1>
    <div class="card">
        <p>Estado: <strong>Activo y monitoreando</strong></p>
        <div class="stats">
            <div class="stat-box">Última actualización<br><span class="stat-val" id="time">2026-11-22</span></div>
            <div class="stat-box">Eventos procesados<br><span class="stat-val">842</span></div>
        </div>
    </div>
    <div id="content">Cargando datos del motor...</div>
    <a href="#" onclick="location.reload()" class="btn-refresh">REFRESCAR DATOS</a>
    <script>
        // Integración con el motor centralizado
        fetch('REPORT_ACTUAL.md')
            .then(r => r.text())
            .then(text => document.getElementById('content').innerText = text.substring(0, 500) + '...');
    </script>
</body>
</html>
