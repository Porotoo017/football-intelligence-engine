<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence Pro - Apuestas Combinadas en Tiempo Real</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: #131b2e;
            --accent: #00f2fe;
            --accent-green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1e293b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 16px; min-height: 100vh; }
        header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
        h1 { font-size: 1.5rem; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }
        .grid { display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
        .match-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .league-tag { font-size: 0.75rem; background: rgba(0, 242, 254, 0.1); color: var(--accent); padding: 3px 8px; border-radius: 6px; font-weight: 600; }
        .match-date { font-size: 0.75rem; color: var(--text-muted); }
        .teams-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; }
        .team { display: flex; align-items: center; gap: 10px; width: 42%; }
        .team.away { justify-content: flex-end; text-align: right; }
        .team img { width: 36px; height: 36px; object-fit: contain; }
        .team span { font-size: 0.95rem; font-weight: 700; }
        .vs { font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .bet-box { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 10px; padding: 12px; margin-top: 12px; }
        .bet-title { font-size: 0.75rem; text-transform: uppercase; color: var(--accent-green); font-weight: 700; margin-bottom: 4px; }
        .bet-main { display: flex; justify-content: space-between; align-items: center; font-size: 0.95rem; font-weight: bold; }
        .odds { background: var(--accent-green); color: #000; padding: 2px 8px; border-radius: 6px; font-size: 0.9rem; }
        .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); }
        .details-grid div b { color: var(--text-main); }
        .analysis { font-size: 0.78rem; color: var(--text-muted); margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; }
        .loading { text-align: center; color: var(--text-muted); margin-top: 40px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <header>
        <h1>Football Intelligence Pro</h1>
        <div class="subtitle">Apuestas Combinadas y Análisis en Tiempo Real</div>
    </header>

    <div id="app" class="grid">
        <div class="loading">Sincronizando datos premium...</div>
    </div>

    <script>
        async function loadData() {
            try {
                const res = await fetch('parlay_engine_output.json?t=' + Date.now());
                const data = await res.json();
                const container = document.getElementById('app');
                container.innerHTML = '';

                data.matches.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="match-header">
                            <span class="league-tag">${m.league}</span>
                            <span class="match-date">${m.date}</span>
                        </div>
                        <div class="teams-row">
                            <div class="team">
                                <img src="${m.homeCrest}" alt="${m.home}" referrerPolicy="no-referrer">
                                <span>${m.home}</span>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team away">
                                <span>${m.away}</span>
                                <img src="${m.awayCrest}" alt="${m.away}" referrerPolicy="no-referrer">
                            </div>
                        </div>
                        <div class="bet-box">
                            <div class="bet-title">Apuesta Combinada Recomendada</div>
                            <div class="bet-main">
                                <span>${m.prediction}</span>
                                <span class="odds">Cuota ${m.odds}</span>
                            </div>
                            <div class="details-grid">
                                <div>Goles: <b>${m.goals}</b></div>
                                <div>Córners: <b>${m.corners}</b></div>
                                <div>Remates: <b>${m.shots}</b></div>
                                <div>Top Rematador: <b>${m.topShooter}</b></div>
                            </div>
                        </div>
                        <div class="analysis">
                            <b>Análisis Probabilístico (${m.probability}):</b> ${m.analysis}
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                document.getElementById('app').innerHTML = '<div class="loading" style="color:#ef4444;">Error de conexión. Intenta nuevamente.</div>';
            }
        }
        loadData();
    </script>
</body>
</html>
