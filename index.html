<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Intelligence Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0e14; color: white; font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; padding: 15px; margin-bottom: 10px; border-radius: 12px; }
        h1 { font-size: 1.5rem; color: #58a6ff; }
        .odd { font-weight: bold; color: #238636; }
    </style>
</head>
<body>
    <h1>Football Intelligence Pro</h1>
    <div id="dashboard">Cargando análisis táctico masivo...</div>
    <script>
        fetch('parlay_engine_output.json')
            .then(r => r.json())
            .then(data => {
                const d = document.getElementById('dashboard');
                d.innerHTML = data.map(i => \`
                    <div class="card">
                        <h3>\${i.match}</h3>
                        <p>Mercado: \${i.market}</p>
                        <p>Probabilidad: \${i.probability}%</p>
                        <p class="odd">Cuota: \${i.odds}</p>
                        <small>\${i.analysis}</small>
                    </div>
                \`).join('');
            });
    </script>
</body>
</html>
