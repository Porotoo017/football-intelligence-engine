<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Football Intelligence Engine</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#09090b">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: { 900: '#18181b', 950: '#09090b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased">
    <header class="sticky top-0 z-50 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-white shadow-lg shadow-emerald-900/40">
                FIE
            </div>
            <div>
                <h1 class="text-sm font-semibold tracking-tight">Football Intelligence</h1>
                <p class="text-xs text-emerald-400 font-medium">Liga Profesional 2026</p>
            </div>
        </div>
        <button id="install-btn" class="hidden text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-3 py-1.5 rounded-lg transition-all shadow-sm active:scale-95">
            Instalar App
        </button>
    </header>

    <main class="flex-1 max-w-xl w-full mx-auto p-4 space-y-4 pb-12">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-2">
                <span class="text-[11px] uppercase tracking-wider font-semibold text-zinc-400">Estado del Motor</span>
                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> En Vivo
                </span>
            </div>
            <p class="text-xs text-zinc-300">
                Modelo predictivo sincronizado con estadísticas de córners, remates al arco y doble oportunidad.
            </p>
        </div>

        <div class="space-y-3">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-zinc-400 px-1">Análisis de Partidos</h2>
            <div id="matches-container" class="space-y-3">
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 animate-pulse">
                    <div class="h-4 bg-zinc-800 rounded w-3/4 mb-3"></div>
                    <div class="h-3 bg-zinc-800 rounded w-1/2"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t border-zinc-900 py-3 text-center text-[11px] text-zinc-500 bg-zinc-950/80">
        Football Intelligence Engine &bull; Modo Móvil PWA
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => {});
            });
        }

        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.classList.add('hidden');
            deferredPrompt = null;
        });

        async function loadData() {
            try {
                const res = await fetch('./data.json');
                const data = await res.json();
                const container = document.getElementById('matches-container');
                
                container.innerHTML = data.map(m => `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3 hover:border-zinc-700 transition-all shadow-lg">
                        <div class="flex justify-between items-center text-sm font-bold text-zinc-100">
                            <span>⚽ ${m.partido}</span>
                            <span class="text-[11px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-md">Alta Confianza</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2 border-t border-zinc-800/60 text-xs">
                            <div class="bg-zinc-950/50 p-2 rounded-lg border border-zinc-800/40">
                                <span class="text-zinc-400 block text-[10px] uppercase">Pronóstico Principal</span>
                                <span class="text-zinc-200 font-semibold mt-0.5 block">${m.pick}</span>
                            </div>
                            <div class="bg-zinc-950/50 p-2 rounded-lg border border-zinc-800/40">
                                <span class="text-zinc-400 block text-[10px] uppercase">Mercado Secundario</span>
                                <span class="text-zinc-200 font-semibold mt-0.5 block">${m.corners || 'Over 8.5 Córners'}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('matches-container').innerHTML = `
                    <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 text-center text-xs text-zinc-400">
                        Error al cargar los datos en vivo. Actualice la página.
                    </div>
                `;
            }
        }
        loadData();
    </script>
</body>
</html>
