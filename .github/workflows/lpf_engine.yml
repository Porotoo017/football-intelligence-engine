name: LPF Intelligence Engine
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Engine
        run: |
          echo "### Reporte de Inteligencia de Fútbol - $(date +'%d/%m/%Y %H:%M:%S ART')" > REPORT_ACTUAL.md
          echo "Motor operativo. Procesando datos y jugadas combinadas..." >> REPORT_ACTUAL.md
      - name: Commit Report
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add REPORT_ACTUAL.md
          git commit -m "Auto-update: $(date +'%d/%m/%Y %H:%M:%S ART')"
          git push
