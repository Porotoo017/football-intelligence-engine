name: Football Intelligence Live Engine

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Live 10-League Quant Engine & Grow History DB
        env:
          BZZOIRO_API_KEY: ${{ secrets.BZZOIRO_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 engine/parlay_engine.py

      - name: Commit updated database, JSON outputs & report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quant_master.db data/parlay_engine_output.json parlay_engine_output.json data/teams_history.json REPORT_ACTUAL.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(engine): auto-sync 10 leagues, rosters & history DB"
            git push
          else
            echo "No changes to commit."
          fi
