name: LPF Intelligence Engine
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Engine
        run: |
          python3 engine/parlay_engine.py
      - name: Commit Report
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add REPORT_ACTUAL.md data.json parlay_engine_output.json
          git commit -m "chore: actualizar reportes de motor" || echo "No changes to commit"
          git push
